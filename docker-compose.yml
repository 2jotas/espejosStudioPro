version: '3.8'

services:
  espejos-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: espejos-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/apps/api/prisma/dev.db
      - JWT_SECRET=super_secret_jwt_espejos_pro_2026
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/uploads:/app/apps/api/uploads

  espejos-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: espejos-web
    restart: always
    depends_on:
      - espejos-api

  espejos-gateway:
    image: nginx:alpine
    container_name: espejos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:80"
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: >
      /bin/sh -c "mkdir -p /etc/letsencrypt/live/espejos-studio.mine.bz &&
      if [ ! -f /etc/letsencrypt/live/espejos-studio.mine.bz/fullchain.pem ]; then
        apk add --no-cache openssl &&
        openssl req -x509 -nodes -newkey rsa:2048 -days 365 -keyout /etc/letsencrypt/live/espejos-studio.mine.bz/privkey.pem -out /etc/letsencrypt/live/espejos-studio.mine.bz/fullchain.pem -subj '/CN=espejos-studio.mine.bz';
      fi &&
      nginx -g 'daemon off;'"
    depends_on:
      - espejos-api
      - espejos-web
