version: '3.8'

services:
  espejos-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: espejos-api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=file:/app/apps/api/prisma/dev.db
      - JWT_SECRET=super_secret_jwt_espejos_pro_2026
    volumes:
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/uploads:/app/apps/api/uploads

  espejos-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: espejos-web
    restart: always
    depends_on:
      - espejos-api

  espejos-hermes:
    build:
      context: .
      dockerfile: Dockerfile.hermes
    container_name: espejos-hermes
    restart: always
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-groq/compound}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./apps/hermes/outputs:/app/apps/hermes/outputs
      - ./PROJECT_BRAIN.md:/app/PROJECT_BRAIN.md
    depends_on:
      - espejos-api

  espejos-gateway:
    image: nginx:alpine
    container_name: espejos-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.gateway.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - ./docker-entrypoint-gateway.sh:/docker-entrypoint-gateway.sh
    entrypoint: ["/bin/sh", "/docker-entrypoint-gateway.sh"]
    depends_on:
      - espejos-api
      - espejos-web
      - espejos-hermes
