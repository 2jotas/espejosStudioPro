server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Proxy API requests to Fastify API container
    location /api/ {
        proxy_pass http://espejos-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploaded photos to Fastify API container
    location /uploads/ {
        proxy_pass http://espejos-api:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy Web Frontend requests to Nginx Web container
    location / {
        proxy_pass http://espejos-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
