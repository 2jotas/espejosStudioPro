# Nginx Gateway Configuration for espejosstudio.cl & Subdomains

# HTTP Server (Port 80 -> mapped to 8080)
server {
    listen 80;
    listen [::]:80;
    server_name espejosstudio.cl www.espejosstudio.cl app.espejosstudio.cl formacion.espejosstudio.cl espejos-studio.mine.bz espejos.cl _;

    client_max_body_size 20M;

    # Let's Encrypt Certbot ACME Challenge Location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy API requests
    location /api/ {
        proxy_pass http://espejos-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Uploads
    location /uploads/ {
        proxy_pass http://espejos-api:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy Web Frontend
    location / {
        proxy_pass http://espejos-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS Server (Port 443 -> mapped to 8443) - Enables WebRTC Live Camera Stream & SSL
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name espejosstudio.cl www.espejosstudio.cl app.espejosstudio.cl formacion.espejosstudio.cl espejos-studio.mine.bz espejos.cl _;

    ssl_certificate /etc/letsencrypt/live/espejos-studio.mine.bz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/espejos-studio.mine.bz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    # Proxy API requests over SSL
    location /api/ {
        proxy_pass http://espejos-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy Uploaded photos over SSL
    location /uploads/ {
        proxy_pass http://espejos-api:3000/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy Web Frontend over SSL
    location / {
        proxy_pass http://espejos-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
