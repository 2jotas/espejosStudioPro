# Nginx Gateway Configuration for espejosstudio.cl & Subdomains

# ==========================================
# 1. HTTP Servers (Port 80)
# ==========================================

# Formacion Data Science Vault (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name formacion.espejosstudio.cl;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://espejos-formacion:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Main Site & CRM (HTTP)
server {
    listen 80;
    listen [::]:80;
    server_name espejosstudio.cl www.espejosstudio.cl app.espejosstudio.cl auto.espejosstudio.cl performance.espejosstudio.cl espejos-studio.mine.bz espejos.cl _;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://espejos-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://espejos-api:3000/uploads/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://espejos-web:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==========================================
# 2. HTTPS Servers (Port 443 SSL)
# ==========================================

# Formacion Data Science Vault (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name formacion.espejosstudio.cl;

    ssl_certificate /etc/letsencrypt/live/espejos-studio.mine.bz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/espejos-studio.mine.bz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20M;

    location / {
        proxy_pass http://espejos-formacion:80/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

